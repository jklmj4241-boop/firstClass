<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동화약품리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper visual">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide">
                            <img src="img/visual01.png" alt="활명수" class="pc">
                            <img src="img/m_visual01.png" alt="모바일 메인 배너 1" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual02.png" alt="판콜" class="pc">
                            <img src="img/m_visual02.png" alt="모바일 메인 배너 2" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual03.png" alt="동화약품 세 번째 메인 배너" class="pc">
                            <img src="img/m_visual03.png" alt="모바일 메인 배너 3" class="mo">
                        </div>
                    </div>
                    <div class="swiper-pagination"></div>
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                    <div class="swiper-scrollbar"></div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>

    <script src="../npm/swiper/swiper-bundle.min.js.js"></script>
    <script>
        const swiper = new Swiper('.visual', {
            direction: 'horizontal',
            slidesPerView: 1,
            loop: true,
            autoplay: {
                delay: 3000,
                disableOnInteraction: false,
            },
            pagination: {
                el: '.visual .swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },
            scrollbar: {
                el: '.visual .swiper-scrollbar',
            },
        });
    </script>
</body>
</html>
