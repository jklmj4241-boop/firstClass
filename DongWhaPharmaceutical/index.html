<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동화약품리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper visual">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide">
                            <img src="img/visual01.png" alt="활명수" class="pc">
                            <img src="img/m_visual01.png" alt="모바일 메인 배너 1" class="mo">
                            <div class="slide-copy">
                                <h1>100년을 넘어<br>오늘도, 동화약품</h1>
                                <p>건강한 내일을 위해<br>동화약품은 언제나 당신과 함께합니다.</p>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual02.png" alt="판콜" class="pc">
                            <img src="img/m_visual02.png" alt="모바일 메인 배너 2" class="mo">
                            <div class="slide-copy slide-copy--hwalmyungsoo">
                                <h1>답답한 속 시원하게<br>속 편한 선택, 활명수</h1>
                                <p>답답함은 날리고 속 편한 일상으로<br>동화약품이 언제나 당신과 함께합니다.</p>
                            </div>
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual03.png" alt="후시딘" class="pc">
                            <img src="img/m_visual03.png" alt="모바일 메인 배너 3" class="mo">
                            <div class="slide-copy">
                                <h1>상처 없는 내일을 위해<br>오늘도, 후시딘</h1>
                                <p>소중한 우리가족의 소중한 일상<br>든든하게 곁에서 지켜드리겠습니다.</p>
                            </div>
                        </div>
                    </div>
                    <div class="swiper-pagination"></div>
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                    <div class="swiper-scrollbar"></div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>

    <script src="../npm/swiper/swiper-bundle.min.js.js"></script>
    <script>
        const swiper = new Swiper('.visual', {
            direction: 'horizontal',
            slidesPerView: 1,
            loop: true,
            autoplay: {
                delay: 5000,
                disableOnInteraction: false,
            },
            pagination: {
                el: '.visual .swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },
            scrollbar: {
                el: '.visual .swiper-scrollbar',
            },
        });
    </script>
</body>
</html>
