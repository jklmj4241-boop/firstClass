<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버거킹 로그인 디자인 테마 비교</title>
    <link rel="stylesheet" href="css/theme-gallery.css">
</head>
<body>
    <main class="gallery">
        <header class="gallery-heading">
            <p class="eyebrow">BURGER KING / UI THEME LAB</p>
            <h1>로그인 디자인 테마</h1>
            <p>테마를 선택하고 같은 로그인 화면에 적용된 디자인을 비교해 보세요.</p>
        </header>

        <section class="theme-controls" aria-label="테마 선택">
            <label for="theme-select">테마 선택</label>
            <select id="theme-select">
                <option value="original">Original · 기본 디자인</option>
                <option value="glassmorphism">Glassmorphism · 글래스모피즘</option>
                <option value="neo-brutalism">Neo Brutalism · 네오 브루탈리즘</option>
                <option value="soft-minimal">Soft Minimal · 소프트 미니멀</option>
            </select>
        </section>

        <section class="theme-cards" aria-label="테마 미리보기">
            <button class="theme-card" type="button" data-theme="original" aria-pressed="true">
                <span class="swatch original"><span></span><span></span><span></span></span>
                <strong>Original</strong>
                <small>기존 버거킹 스타일</small>
            </button>
            <button class="theme-card" type="button" data-theme="glassmorphism" aria-pressed="false">
                <span class="swatch glass"><span></span><span></span><span></span></span>
                <strong>Glassmorphism</strong>
                <small>투명함과 블러 효과</small>
            </button>
            <button class="theme-card" type="button" data-theme="neo-brutalism" aria-pressed="false">
                <span class="swatch neo"><span></span><span></span><span></span></span>
                <strong>Neo Brutalism</strong>
                <small>굵은 테두리와 그림자</small>
            </button>
            <button class="theme-card" type="button" data-theme="soft-minimal" aria-pressed="false">
                <span class="swatch soft"><span></span><span></span><span></span></span>
                <strong>Soft Minimal</strong>
                <small>단순하고 차분한 구성</small>
            </button>
        </section>

        <div class="preview-heading">
            <h2>실제 화면 미리보기</h2>
            <span>테마를 바꾸면 아래 화면이 변경됩니다.</span>
        </div>
        <iframe
            id="login-preview"
            class="preview-frame"
            src="login.html?theme=original"
            title="선택한 버거킹 로그인 테마 미리보기"
        ></iframe>
        <p class="note">※ 이 화면은 디자인 비교용 미리보기입니다. 로그인 기능이나 실제 계정 인증은 수행하지 않습니다.</p>
    </main>
    <script src="js/theme-gallery.js"></script>
</body>
</html>
