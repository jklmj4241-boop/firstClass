<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="../css/default.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div id="wrap">
    <header class="login_header">
      <a href="../index.html" class="prev_btn" aria-label="이전 페이지">
        <img src="img/Arrow_back.svg" alt="">
      </a>
      <h1>로그인</h1>
    </header>

    <div class="security_notice">
      안전한 이용 및 회원님의 정보 보호를 위해<br>
      현재 보안서비스가 실행 중입니다.
    </div>

    <main>
      <section class="login_section">
        <h2>이메일 로그인</h2>
        <form>
          <fieldset>
            <legend class="sr-only">이메일 로그인</legend>
            <div class="input_box">
              <label for="email" class="sr-only">이메일</label>
              <input type="email" id="email" name="email"
                placeholder="이메일(이메일)을 입력해 주세요." autocomplete="email">
            </div>

            <div class="input_box password_box">
              <label for="password" class="sr-only">비밀번호</label>
              <div class="password_input">
                <input type="password" id="password" name="password"
                  placeholder="비밀번호를 입력해 주세요." autocomplete="current-password">
                <button type="button" class="pw_btn" aria-label="비밀번호 보기">
                  <img src="img/eye_icon.svg" alt="">
                </button>
              </div>
            </div>          
          </fieldset>
        </form>

        <nav class="login_link" aria-label="회원 관련 메뉴">
          <ul>
            <li><a href="#">아이디 찾기</a></li>
            <li><a href="#">비밀번호 재설정</a></li>
            <li><a href="#">회원가입</a></li>
          </ul>
        </nav>
      </section>

      <section class="sns_login">
        <h2>네이버, 카카오로 <strong>간편하게 시작</strong>하세요</h2>
        <ul class="sns_list">
          <li>
            <a href="#" class="sns_btn naver">
              <img src="img/naver_logo_icon.svg" alt="">
              <span>네이버로 시작하기</span>
            </a>
          </li>
          <li>
            <a href="#" class="sns_btn kakao">
              <img src="img/kakao_logo_icon.svg" alt="">
              <span>카카오로 시작하기</span>
            </a>
          </li>
        </ul>
      </section>
    </main>
  </div>
</body>
</html>
